<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 生日快乐，LQ！</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(145deg, #1a0a2e 0%, #2d1b4e 25%, #4a2c6d 50%, #6b3fa0 75%, #8b5cf6 100%);
    font-family: 'Noto Sans SC', sans-serif;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* ===== 星空粒子背景 ===== */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(255, 215, 0, 0.6);
    border-radius: 50%;
    animation: float-up linear infinite;
  }
  @keyframes float-up {
    0%   { transform: translateY(100vh) scale(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1) rotate(720deg); opacity: 0; }
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0%   { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 1;   transform: scale(1.3); }
  }

  .floating-icons {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .floating-icon {
    position: absolute;
    font-size: 24px;
    animation: drift-around 12s ease-in-out infinite;
    opacity: 0.4;
  }
  @keyframes drift-around {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
    25%  { transform: translate(30px, -20px) rotate(90deg) scale(1.1); }
    50%  { transform: translate(-10px, -40px) rotate(180deg) scale(0.9); }
    75%  { transform: translate(20px, -10px) rotate(270deg) scale(1.05); }
    100% { transform: translate(0, 0) rotate(360deg) scale(1); }
  }

  .shooting-star {
    position: fixed;
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), #fff);
    border-radius: 1px;
    animation: shoot 4s linear infinite;
    opacity: 0;
    z-index: 0;
    pointer-events: none;
  }
  .shooting-star::after {
    content: '';
    position: absolute;
    right: -4px;
    top: -3px;
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px 2px #fff;
  }
  .shooting-star:nth-child(1) { top: 10%; left: 60%; animation-delay: 2s; }
  .shooting-star:nth-child(2) { top: 15%; left: 30%; animation-delay: 5s; }
  @keyframes shoot {
    0%   { transform: translateX(0) translateY(0) rotate(-30deg); opacity: 0; }
    5%   { opacity: 1; }
    20%  { transform: translateX(-300px) translateY(170px) rotate(-30deg); opacity: 0; }
    100% { opacity: 0; }
  }

  .bg-glow {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.08;
  }
  .bg-glow:nth-child(1) {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #ffd700, transparent);
    top: -100px; right: -100px;
    animation: pulse-slow 6s ease-in-out infinite alternate;
  }
  .bg-glow:nth-child(2) {
    width: 300px; height: 300px;
    background: radial-gradient(circle, #ec4899, transparent);
    bottom: -80px; left: -80px;
    animation: pulse-slow 8s ease-in-out infinite alternate;
  }
  .bg-glow:nth-child(3) {
    width: 250px; height: 250px;
    background: radial-gradient(circle, #8b5cf6, transparent);
    top: 40%; left: -60px;
    animation: pulse-slow 7s ease-in-out infinite alternate-reverse;
  }
  @keyframes pulse-slow {
    100% { transform: scale(1.15); opacity: 0.12; }
  }

  /* ===== 4.PNG 生日快乐 背景装饰 ===== */
  .birthday-text-bg {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    opacity: 0.15;
    mix-blend-mode: overlay;
    width: 90vmin;
    max-width: 700px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-8deg) scale(1);
    animation: bg-text-pulse 4s ease-in-out infinite alternate;
    filter: saturate(1.3) brightness(1.5) drop-shadow(0 0 30px rgba(255, 215, 0, 0.3));
  }
  .birthday-text-bg img {
    width: 100%;
    height: auto;
    display: block;
  }
  @keyframes bg-text-pulse {
    0%   { transform: translate(-50%, -50%) rotate(-8deg) scale(0.95); opacity: 0.10; }
    100% { transform: translate(-50%, -50%) rotate(-6deg) scale(1.05); opacity: 0.20; }
  }

  /* ===== 主卡片 ===== */
  .card {
    position: relative;
    z-index: 1;
    width: 90%;
    max-width: 820px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 32px;
    padding: 50px 40px 40px;
    margin: 60px auto;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    text-align: center;
    animation: card-appear 1.2s ease-out;
  }
  @keyframes card-appear {
    0%   { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ===== 头像：1.jpeg ===== */
  .photo-frame {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    margin: 0 auto 20px;
    overflow: hidden;
    position: relative;
    border: 4px solid rgba(255, 215, 0, 0.6);
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.2), 0 8px 32px rgba(0, 0, 0, 0.3);
    animation: photo-glow 3s ease-in-out infinite alternate;
  }
  @keyframes photo-glow {
    0%   { box-shadow: 0 0 30px rgba(255, 215, 0, 0.15), 0 8px 32px rgba(0, 0, 0, 0.3); }
    100% { box-shadow: 0 0 60px rgba(255, 215, 0, 0.4), 0 8px 32px rgba(0, 0, 0, 0.3); }
  }
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(1.05) saturate(1.1) contrast(1.05);
  }
  .photo-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, transparent 50%, rgba(139, 92, 246, 0.2) 100%);
    pointer-events: none;
  }

  /* ===== 标题 ===== */
  .greeting {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 46px;
    color: #ffd700;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-shadow: 0 2px 20px rgba(255, 215, 0, 0.3);
    margin-bottom: 12px;
    animation: text-glow 3s ease-in-out infinite alternate;
  }
  @keyframes text-glow {
    0%   { text-shadow: 0 2px 20px rgba(255, 215, 0, 0.3); }
    100% { text-shadow: 0 2px 40px rgba(255, 215, 0, 0.6), 0 0 80px rgba(255, 215, 0, 0.15); }
  }
  .subtitle {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.4);
    font-weight: 300;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .name-display {
    font-size: 28px;
    color: rgba(255, 255, 255, 0.85);
    font-weight: 500;
    margin-bottom: 24px;
    letter-spacing: 2px;
  }
  .name-display .highlight {
    color: #fbbf24;
    font-weight: 900;
    font-size: 34px;
  }

  .wishes {
    position: relative;
    margin: 24px 0 20px;
    text-align: left;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }
  .wishes p {
    color: rgba(255, 255, 255, 0.78);
    font-size: 15px;
    line-height: 1.9;
    font-weight: 300;
    opacity: 0;
    transform: translateY(10px);
    animation: fade-up 0.8s ease forwards;
    padding-left: 24px;
    position: relative;
  }
  .wishes p::before {
    content: '✦';
    position: absolute;
    left: 0;
    color: rgba(255, 215, 0, 0.4);
    font-size: 11px;
    top: 2px;
  }
  .wishes p:nth-child(1) { animation-delay: 0.8s; }
  .wishes p:nth-child(2) { animation-delay: 1.4s; }
  .wishes p:nth-child(3) { animation-delay: 2.0s; }

  @keyframes fade-up {
    to { opacity: 1; transform: translateY(0); }
  }
  .wishes .signoff {
    margin-top: 16px;
    color: rgba(255, 215, 0, 0.7);
    font-weight: 500;
    font-size: 16px;
    text-align: right;
    padding-right: 8px;
  }
  .wishes .signoff::before {
    display: none;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 20px 0 16px;
    color: rgba(255, 215, 0, 0.3);
    font-size: 20px;
  }
  .divider .line {
    flex: 1;
    max-width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.3), transparent);
  }

  /* ===== 蜡烛 ===== */
  .candle-section {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 20px 0 0;
  }
  .candle {
    position: relative;
    width: 18px;
    height: 50px;
    background: linear-gradient(180deg, #f59e0b, #d97706);
    border-radius: 4px 4px 9px 9px;
    animation: candle-wiggle 3s ease-in-out infinite;
  }
  .candle:nth-child(2) { animation-delay: 0.4s; }
  .candle:nth-child(3) { animation-delay: 0.8s; }
  .candle:nth-child(4) { animation-delay: 1.2s; }
  .candle:nth-child(5) { animation-delay: 1.6s; }
  @keyframes candle-wiggle {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(1deg); }
    75%      { transform: rotate(-1deg); }
  }
  .flame {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 18px;
    background: radial-gradient(ellipse at center, #fef08a 0%, #f59e0b 40%, #dc2626 70%, transparent 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flame-flicker 0.8s ease-in-out infinite alternate;
    z-index: 2;
  }
  .candle:nth-child(2) .flame { animation-delay: 0.15s; animation-duration: 0.7s; }
  .candle:nth-child(3) .flame { animation-delay: 0.3s; animation-duration: 0.9s; }
  .candle:nth-child(4) .flame { animation-delay: 0.1s; animation-duration: 0.65s; }
  .candle:nth-child(5) .flame { animation-delay: 0.25s; animation-duration: 0.75s; }
  @keyframes flame-flicker {
    0%   { transform: translateX(-50%) scaleY(1) scaleX(1); opacity: 0.9; }
    25%  { transform: translateX(-45%) scaleY(1.1) scaleX(0.9); opacity: 1; }
    50%  { transform: translateX(-55%) scaleY(0.95) scaleX(1.05); opacity: 0.95; }
    75%  { transform: translateX(-48%) scaleY(1.05) scaleX(0.95); opacity: 1; }
    100% { transform: translateX(-52%) scaleY(1) scaleX(1); opacity: 0.9; }
  }
  .candle-body-wrap {
    position: relative;
    width: 18px;
    height: 50px;
    overflow: hidden;
    border-radius: 4px 4px 9px 9px;
  }
  .candle-stripe {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 8px,
      rgba(255, 255, 255, 0.06) 8px,
      rgba(255, 255, 255, 0.06) 9px
    );
  }
  .candle .wick {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 6px;
    background: #555;
    border-radius: 1px;
    z-index: 1;
  }

  /* ===== 滚动提示 ===== */
  .scroll-hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    color: rgba(255, 255, 255, 0.3);
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 3px;
    animation: bounce-down 2s ease-in-out infinite;
  }
  @keyframes bounce-down {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.3; }
    50%      { transform: translateX(-50%) translateY(8px); opacity: 0.6; }
  }

  /* ===== 照片墙：2.PNG 和 7.28.mov 视频 ===== */
  .photo-wall {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 30px 0 10px;
    padding: 0 10px;
  }
  .photo-item {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(255, 215, 0, 0.15);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
    cursor: default;
    aspect-ratio: 1198/1313;
    background: #1a0a2e;
  }
  .photo-item:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 14px 40px rgba(255, 215, 0, 0.15);
    border-color: rgba(255, 215, 0, 0.35);
  }
  .photo-item img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    filter: brightness(0.95) saturate(1.05) contrast(1.05);
    transition: filter 0.4s ease;
  }
  .photo-item:hover img {
    filter: brightness(1.02) saturate(1.1) contrast(1.08);
  }
  .photo-item::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.02) 0%,
      rgba(139, 92, 246, 0.08) 50%,
      rgba(26, 10, 46, 0.15) 100%
    );
    pointer-events: none;
    border-radius: 14px;
    z-index: 2;
  }
  .photo-item:nth-child(odd) {
    transform: rotate(-0.8deg);
  }
  .photo-item:nth-child(even) {
    transform: rotate(1.2deg);
    margin-top: 10px;
  }
  .photo-item:nth-child(odd):hover {
    transform: rotate(-0.5deg) translateY(-6px) scale(1.02);
  }
  .photo-item:nth-child(even):hover {
    transform: rotate(0.9deg) translateY(-6px) scale(1.02);
  }

  /* ===== 视频播放器 ===== */
  .photo-item.video-item {
    display: flex;
    flex-direction: column;
    aspect-ratio: auto;
  }
  .photo-item.video-item video {
    width: 100%;
    flex-shrink: 0;
    display: block;
    aspect-ratio: 1280/720;
    object-fit: cover;
    filter: brightness(0.9) saturate(1.05) contrast(1.05) blur(0.5px);
    transition: filter 0.6s ease;
  }
  .photo-item.video-item:hover video {
    filter: brightness(0.95) saturate(1.1) contrast(1.08) blur(0);
  }
  /* 虚幻光晕叠加 */
  .photo-item.video-item .video-glow {
    position: absolute;
    inset: -20%;
    background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.15), transparent 70%);
    pointer-events: none;
    z-index: 1;
    animation: video-glow-pulse 3s ease-in-out infinite alternate;
    mix-blend-mode: screen;
  }
  @keyframes video-glow-pulse {
    0%   { opacity: 0.4; transform: scale(1); }
    100% { opacity: 0.8; transform: scale(1.1); }
  }
  .photo-item.video-item::after {
    background: linear-gradient(
      180deg,
      rgba(139, 92, 246, 0.12) 0%,
      rgba(26, 10, 46, 0.25) 100%
    );
  }

  /* ===== 纸屑 ===== */
  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    top: -10px;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0.4; }
  }

  .photo-caption {
    color: rgba(255, 255, 255, 0.3);
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 2px;
    margin-top: 12px;
  }
  .video-item-label {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 32px;
    color: #ffd700;
    text-shadow: 0 2px 20px rgba(255, 215, 0, 0.3);
    letter-spacing: 6px;
    background: linear-gradient(180deg, rgba(26, 10, 46, 0.3), transparent);
    padding: 0 10px 6px;
    animation: label-glow 3s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes label-glow {
    0%   { text-shadow: 0 2px 20px rgba(255, 215, 0, 0.3); }
    100% { text-shadow: 0 2px 40px rgba(255, 215, 0, 0.6), 0 0 80px rgba(255, 215, 0, 0.15); }
  }

  /* ===== 音乐切换按钮 ===== */
  .music-toggle {
    position: fixed;
    bottom: 64px;
    right: 24px;
    z-index: 20;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 215, 0, 0.25);
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: rgba(255, 215, 0, 0.7);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  }
  .music-toggle:hover {
    background: rgba(255, 215, 0, 0.15);
    border-color: rgba(255, 215, 0, 0.5);
    transform: scale(1.1);
    box-shadow: 0 4px 24px rgba(255, 215, 0, 0.2);
  }
  .music-toggle.playing {
    animation: music-pulse 2s ease-in-out infinite;
  }
  @keyframes music-pulse {
    0%, 100% { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); }
    50%      { box-shadow: 0 4px 24px rgba(255, 215, 0, 0.3), 0 0 40px rgba(255, 215, 0, 0.1); }
  }

  /* ===== 响应式 ===== */
  @media (max-width: 700px) {
    .card { padding: 30px 18px; border-radius: 24px; margin: 30px auto; }
    .greeting { font-size: 30px; letter-spacing: 2px; }
    .photo-frame { width: 150px; height: 150px; }
    .subtitle { font-size: 12px; letter-spacing: 4px; }
    .wishes p { font-size: 14px; padding-left: 20px; }
    .wishes p::before { font-size: 10px; }
    .candle { width: 14px; height: 40px; }
    .photo-wall { grid-template-columns: 1fr; gap: 16px; }
    .photo-item { aspect-ratio: auto; }
    .photo-item:nth-child(odd),
    .photo-item:nth-child(even) {
      transform: none;
      margin-top: 0;
    }
    .photo-item:hover {
      transform: translateY(-4px) scale(1.01);
    }
    .video-item-label { font-size: 26px; letter-spacing: 4px; padding: 0 8px 4px; }
    .birthday-text-bg { width: 95vmin; opacity: 0.08; }
    .bg-glow { opacity: 0.05; }
    .music-toggle { bottom: 48px; right: 14px; width: 38px; height: 38px; font-size: 15px; }
  }

  @media (max-width: 420px) {
    .card { padding: 22px 14px; border-radius: 20px; margin: 20px auto; }
    .greeting { font-size: 24px; letter-spacing: 1px; }
    .photo-frame { width: 120px; height: 120px; }
    .subtitle { font-size: 10px; letter-spacing: 3px; margin-bottom: 20px; }
    .wishes p { font-size: 13px; line-height: 1.8; }
    .photo-wall { gap: 12px; }
    .video-item-label { font-size: 20px; letter-spacing: 3px; }
    .scroll-hint { display: none; }
    .shooting-star { display: none; }
    .candle { width: 12px; height: 34px; }
    .flame { width: 8px; height: 14px; top: -14px; }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow"></div>
<div class="bg-glow"></div>

<!-- 4.PNG 生日快乐文字背景装饰 -->
<div class="birthday-text-bg">
  <img src="4.PNG" alt="生日快乐背景装饰">
</div>

<div class="stars" id="stars"></div>

<div class="particles" id="particles"></div>

<div class="floating-icons" id="floatingIcons"></div>

<div class="shooting-star"></div>
<div class="shooting-star"></div>

<div class="confetti-container" id="confetti"></div>

<!-- 音乐按钮 -->
<button class="music-toggle" id="musicToggle" aria-label="音乐控制">♪</button>

<!-- 背景音乐 -->
<audio id="bgMusic" loop preload="auto">
  <source src="7.28_audio.m4a" type="audio/mp4">
  <source src="7.28.mov" type="video/quicktime">
</audio>

<div class="card">
  <!-- 头像 1.jpeg -->

<div class="scroll-hint">↓ SCROLL ↓</div>

<script>
  (function() {
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = (Math.random() * 3) + 's';
      star.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
      star.style.width = star.style.height = (1.5 + Math.random() * 2) + 'px';
      starsContainer.appendChild(star);
    }

    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.width = p.style.height = (3 + Math.random() * 5) + 'px';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      const colors = ['rgba(255, 215, 0, 0.5)', 'rgba(255, 182, 193, 0.4)', 'rgba(139, 92, 246, 0.4)', 'rgba(255, 255, 255, 0.3)'];
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      particlesContainer.appendChild(p);
    }

    const iconContainer = document.getElementById('floatingIcons');
    const icons = ['🎂', '🎈', '🎉', '🎊', '✨', '💫', '🌟', '❤️', '🕯️', '🥂'];
    for (let i = 0; i < 12; i++) {
      const el = document.createElement('div');
      el.className = 'floating-icon';
      el.textContent = icons[i % icons.length];
      el.style.left = Math.random() * 90 + '%';
      el.style.top = Math.random() * 90 + '%';
      el.style.fontSize = (16 + Math.random() * 20) + 'px';
      el.style.animationDelay = (Math.random() * 10) + 's';
      el.style.animationDuration = (10 + Math.random() * 8) + 's';
      el.style.opacity = 0.2 + Math.random() * 0.3;
      iconContainer.appendChild(el);
    }

    const confettiContainer = document.getElementById('confetti');
    const confettiColors = ['#ffd700', '#ec4899', '#8b5cf6', '#f43f5e', '#22d3ee', '#fbbf24', '#34d399', '#f472b6'];
    for (let i = 0; i < 80; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const size = 6 + Math.random() * 10;
      piece.style.width = size + 'px';
      piece.style.height = size + 'px';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.top = '-10px';
      piece.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      piece.style.animationDuration = (2 + Math.random() * 3) + 's';
      piece.style.animationDelay = (Math.random() * 2) + 's';
      piece.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
      confettiContainer.appendChild(piece);
    }

    // 音乐控制 — 页面打开自动播放，跳过前几秒
    const audio = document.getElementById('bgMusic');
    const toggle = document.getElementById('musicToggle');
    let isPlaying = false;

    // 尝试跳过前几秒
    audio.addEventListener('loadedmetadata', function() {
      // 跳过前 3 秒
      const skipAhead = 3;
      if (audio.duration > skipAhead + 1) {
        audio.currentTime = skipAhead;
      }
    });

    // 尝试自动播放（浏览器策略限制下可能需要用户点击后生效）
    function startAudio() {
      return audio.play().then(() => {
        toggle.classList.add('playing');
        toggle.textContent = '♫';
        isPlaying = true;
      }).catch(() => {
        // 浏览器拦截了自动播放，等用户首次交互
      });
    }

    // 页面加载后立即尝试开启音乐
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(startAudio, 500);
    });

    toggle.addEventListener('click', function() {
      if (isPlaying) {
        audio.pause();
        toggle.classList.remove('playing');
        toggle.textContent = '♪';
        isPlaying = false;
      } else {
        audio.currentTime = Math.max(0, audio.currentTime || 3);
        audio.play().then(() => {
          toggle.classList.add('playing');
          toggle.textContent = '♫';
          isPlaying = true;
        }).catch(() => {});
      }
    });

    // 首次点击页面作为 autoplay 兜底
    document.addEventListener('click', function initAudio() {
      if (!isPlaying && audio.paused) {
        audio.play().then(() => {
          toggle.classList.add('playing');
          toggle.textContent = '♫';
          isPlaying = true;
        }).catch(() => {});
      }
    }, { once: true });

    // 音乐循环时保持状态同步
    audio.addEventListener('ended', function() {
      // loop 属性会自动重播
      if (audio.loop) {
        audio.currentTime = 3; // 循环时也跳过开头几秒
      }
    });

    // 检测视频是否不支持某些格式
    const video = document.querySelector('video');
    if (video) {
      video.addEventListener('error', function() {
        console.log('Video playback error, fallback to image');
        // 如果视频无法播放，显示一个静态占位
        this.style.display = 'none';
        const parent = this.closest('.photo-item');
        if (parent) {
          const fallback = document.createElement('div');
          fallback.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,215,0,0.3);font-size:48px;background:rgba(255,255,255,0.03);';
          fallback.textContent = '🎬';
          parent.appendChild(fallback);
        }
      });
    }
  })();
</script>

</body>
</html>
